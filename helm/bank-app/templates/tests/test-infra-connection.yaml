apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-infrastructure-test"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed
spec:
  containers:
    - name: test-prometheus
      image: curlimages/curl:8.5.0
      command: ['sh', '-c']
      args:
        - |
          curl -f http://prometheus-service:9090/-/healthy && \
          curl -f http://bank-grafana:3000/api/health && \
          (curl {{ .Release.Name }}-kafka:9092 || [ $? -eq 52 ])  && \
          curl -f http://zipkin:9411/health && \
          curl -f http://kibana:5601/api/status
  restartPolicy: Never
