apiVersion: apps/v1
kind: Deployment
metadata:
  name: cash
  labels:
    app: cash
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: cash
  template:
    metadata:
      labels:
        app: cash
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z bank-postgres 5432; do echo waiting for postgres; sleep 3; done;' ]
        - name: wait-for-keycloak
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z keycloak 8080; do echo waiting for keycloak; sleep 3; done;' ]
        - name: wait-for-kafka
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z kafka 9092; do echo waiting for {{ .Release.Name }}-kafka; sleep 3; done;' ]
      containers:
        - name: cash
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - "--spring.security.oauth2.client.registration.cash-client.provider=keycloak"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_CLOUD_CONSUL_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONSUL_CONFIG_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED
              value: "false"

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://bank-postgres:5432/cash_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bank-global-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate" # Как в вашей конфигурации ddl-auto=validate
            - name: SPRING_CLOUD_LOADBALANCER_ENABLED
              value: "false"
            - name: SPRING_CLOUD_DISCOVERY_ENABLED
              value: "false"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_CLIENT_CLIENT_ID
              value: "cash-service-client"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_CLIENT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bank-global-secrets
                  key: CASH_KEYCLOAK_CLIENT_SECRET
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_CLIENT_CLIENT_AUTHENTICATION_METHOD
              value: "client_secret_post"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_CLIENT_AUTHORIZATION_GRANT_TYPE
              value: "client_credentials"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_CLIENT_PROVIDER
              value: "keycloak"

            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI
              value: "http://keycloak:8080/realms/bank-realm"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak:8080/realms/bank-realm"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs"

            - name: APP_SERVICES_ACCOUNTS_URL
              value: "http://accounts:8082"
            - name: APP_SERVICES_NOTIFICATION_URL
              value: "http://notification:8086"

            - name: RESILIENCE4J_RETRY_INSTANCES_ACCOUNTS_MAX_ATTEMPTS
              value: "3"
            - name: RESILIENCE4J_RETRY_INSTANCES_ACCOUNTS_WAIT_DURATION
              value: "1s"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_ACCOUNTS_SLIDING_WINDOW_SIZE
              value: "5"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_ACCOUNTS_FAILURE_RATE_THRESHOLD
              value: "50"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_ACCOUNTS_WAIT_DURATION_IN_OPEN_STATE
              value: "10s"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_NOTIFICATIONS_SLIDING_WINDOW_SIZE
              value: "5"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_NOTIFICATIONS_FAILURE_RATE_THRESHOLD
              value: "50"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_NOTIFICATIONS_WAIT_DURATION_IN_OPEN_STATE
              value: "10s"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Release.Name }}-kafka:9092"
            - name: APP_KAFKA_TOPICS_NOTIFICATION
              value: "{{ .Values.global.notificationTopic }}"
