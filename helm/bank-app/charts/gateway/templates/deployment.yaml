apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_CLOUD_CONSUL_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONSUL_CONFIG_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED
              value: "false"
            - name: SPRING_APPLICATION_NAME
              value: "bank-gateway"
#            - name: JAVA_TOOL_OPTIONS
#              value: "-Dmanagement.tracing.web.client.lookup-with-observation=true"

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "{{ .Values.global.keycloak.url }}/realms/{{ .Values.global.keycloak.realm }}"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://keycloak:8080/realms/{{ .Values.global.keycloak.realm }}/protocol/openid-connect/certs"

            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_ID
              value: "account-service"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
              value: "http://accounts:8082" # Перевод на ClusterIP DNS
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
              value: "Path=/accounts/**"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0_NAME
              value: "TokenRelay"

            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_ID
              value: "transfer-service"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_URI
              value: "http://transfer:8083"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0
              value: "Path=/transfers,/transfers/**"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_FILTERS_0_NAME
              value: "TokenRelay"

            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_ID
              value: "cash-service"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_URI
              value: "http://cash:8087"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0
              value: "Path=/cash,/cash/**"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_FILTERS_0_NAME
              value: "TokenRelay"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY
              value: "TRACE"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
              value: "DEBUG"
            - name: LOGGING_LEVEL_WEB
              value: "DEBUG"
#            - name: SPRING_ZIPKIN_BASE_URL
#              value: "http://zipkin:9411"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"

            - name: MANAGEMENT_TRACING_PROPAGATION_TYPE
              value: "B3"


            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics,tracing,prometheus"
            - name: LOGGING_LEVEL_IO_MICROMETER_TRACING
              value: "DEBUG"

#            - name: JAVA_TOOL_OPTIONS
#              value: "-Dmanagement.tracing.propagation.type=B3 -Dspring.cloud.gateway.observability.enabled=true"
            - name: SPRING_CLOUD_GATEWAY_OBSERVABILITY_ENABLED
              value: "true"
            - name: LOGSTASH_HOST
              value: "logstash"
            - name: LOGSTASH_PORT
              value: "5044"
            - name: LOGGING_LEVEL_ROOT
              value: "DEBUG"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY
              value: "DEBUG"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SERVER_ADAPTER_HTTPWEBHANDLERADAPTER
              value: "TRACE"

