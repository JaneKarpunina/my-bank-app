apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-kafka 9092; do echo waiting for kafka; sleep 3; done;']
      containers:
        - name: notification
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-kafka-config
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_CLOUD_CONSUL_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONSUL_CONFIG_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED
              value: "false"
            - name: "spring.kafka.bootstrap-servers"
              value: "{{ .Release.Name }}-kafka:9092"
            - name: APP_KAFKA_TOPICS_NOTIFICATION
              value: "{{ .Values.global.notificationTopic }}"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"

            - name: SPRING_ZIPKIN_BASE_URL
              value: "http://zipkin:9411"

            - name: MANAGEMENT_TRACING_PROPAGATION_TYPE
              value: "W3C"

            - name: SPRING_KAFKA_PRODUCER_PROPERTIES_INTERCEPTOR_CLASSES
              value: "io.micrometer.tracing.handler.PropagatingSenderTracingObservationHandler"
