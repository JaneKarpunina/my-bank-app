apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-kafka 9092; do echo waiting for kafka; sleep 3; done;']
      containers:
        - name: notification
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-kafka-config
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_CLOUD_CONSUL_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONSUL_CONFIG_ENABLED
              value: "false"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED
              value: "false"
            - name: SPRING_APPLICATION_NAME
              value: "notification-service"
            - name: "spring.kafka.bootstrap-servers"
              value: "{{ .Release.Name }}-kafka:9092"
            - name: APP_KAFKA_TOPICS_NOTIFICATION
              value: "{{ .Values.global.notificationTopic }}"
#            - name: SPRING_ZIPKIN_BASE_URL
#              value: "http://zipkin:9411"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"

            - name: MANAGEMENT_TRACING_PROPAGATION_TYPE
              value: "B3"


            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics,tracing,prometheus"
            - name: LOGGING_LEVEL_IO_MICROMETER_TRACING
              value: "DEBUG"
            - name: SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dmanagement.tracing.propagation.type=B3 -Dmanagement.tracing.enabled=true"

