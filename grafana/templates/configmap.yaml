apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-conf
  namespace: {{ .Release.Namespace }}
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://bank-prometheus-server:9090
        isDefault: true
        editable: true

  dashboards-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'Bank Dashboards'
        orgId: 1
        folder: 'Spring Boot Monitoring'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
