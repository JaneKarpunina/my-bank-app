
spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.enabled=false

spring.cloud.consul.discovery.register=false
spring.cloud.service-registry.auto-registration.enabled=false
spring.config.import=optional:noop


spring.security.oauth2.client.registration.cash-client.client-id=mock-client
spring.security.oauth2.client.registration.cash-client.client-secret=mock-secret
spring.security.oauth2.client.registration.cash-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.cash-client.provider=mock-provider

spring.security.oauth2.client.provider.mock-provider.authorization-uri=http://localhost/oauth/authorize
spring.security.oauth2.client.provider.mock-provider.token-uri=http://localhost/oauth/token
spring.security.oauth2.client.provider.mock-provider.jwk-set-uri=http://localhost/oauth/jwks

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/oauth/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/realms/bank-realm

spring.datasource.url=jdbc:h2:mem:cash_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=ON,CONFLICT
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

app.services.accounts-url=http://accounts-service
app.services.notification-url=http://notification-service
