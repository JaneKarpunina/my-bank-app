spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.config.import=optional:noop
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://mock-keycloak

spring.datasource.url=jdbc:h2:mem:test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.services.accounts-url=http://accounts-service
app.services.notification-url=http://notification-service